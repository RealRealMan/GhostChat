# Builds unsigned installers for all three OSes from a version tag and
# publishes them, with SHA-256 checksums, as a GitHub Release.
# Manual: Actions -> release -> Run workflow, enter the tag (e.g. v0.2.0).
# The release text comes from .github/release-notes/<tag>.md.
# macOS and Linux packages have not yet been installed on real machines.
name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to build and publish, e.g. v0.2.0"
        required: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_PACKAGER_VERSION: "0.11.8"

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            formats: nsis
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            formats: app,dmg
            target: aarch64-apple-darwin
          - os: macos-latest
            formats: app,dmg
            target: x86_64-apple-darwin
          - os: ubuntu-22.04
            formats: appimage,deb
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxdo-dev libxkbcommon-dev libasound2-dev \
            libwayland-dev libdbus-1-dev libfuse2 file
      - run: cargo install cargo-packager --version ${{ env.CARGO_PACKAGER_VERSION }} --locked
      - name: Build packages
        shell: bash
        run: |
          # before-packaging-command builds for the host; build the target explicitly.
          cargo build --release --target ${{ matrix.target }}
          cargo packager --release --target ${{ matrix.target }} --formats ${{ matrix.formats }}
      - name: macOS ad-hoc signature check
        if: runner.os == 'macOS'
        run: codesign --verify --deep --verbose=2 dist/*.app || true
      - name: Name the DMG after its CPU
        if: runner.os == 'macOS'
        shell: bash
        run: |
          # Both macOS builds would otherwise upload a file with the same name.
          version="${{ inputs.tag }}"
          for f in dist/*.dmg; do
            mv "$f" "dist/GhostChat_${version#v}_${{ matrix.target }}.dmg"
          done
      - name: Checksums
        shell: bash
        run: |
          cd dist
          find . -maxdepth 1 -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' \) \
            -exec sha256sum {} \; > SHA256SUMS-${{ matrix.target }}.txt || \
          shasum -a 256 *.dmg > SHA256SUMS-${{ matrix.target }}.txt
          cat SHA256SUMS-*.txt
      - uses: actions/upload-artifact@v7
        with:
          name: ghostchat-${{ matrix.target }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
            dist/SHA256SUMS-*.txt

  publish:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The branch the workflow runs from (main): it has the release notes,
      # which are written after the tag.
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: assets
          merge-multiple: true
      - name: One checksum file
        shell: bash
        run: |
          cd assets
          cat SHA256SUMS-*.txt | sed 's#\./##; s#\*##' > SHA256SUMS.txt
          rm SHA256SUMS-*.txt
          ls -la
          cat SHA256SUMS.txt
      - name: Create or update the GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          notes=".github/release-notes/${TAG}.md"
          test -f "$notes" || { echo "missing $notes"; exit 1; }
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --notes-file "$notes"
            gh release upload "$TAG" assets/* --clobber
          else
            gh release create "$TAG" assets/* --verify-tag \
              --title "GhostChat ${TAG}" --notes-file "$notes"
          fi
