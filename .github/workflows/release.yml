# Builds unsigned installers for all three OSes and SHA-256 checksums.
# Trigger manually or by pushing a tag like v0.1.0.
# Packages build successfully on GitHub (v0.1.0). macOS and Linux packages
# have not yet been installed on real machines.
name: release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_PACKAGER_VERSION: "0.11.8"

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            formats: nsis
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            formats: app,dmg
            target: aarch64-apple-darwin
          - os: macos-latest
            formats: app,dmg
            target: x86_64-apple-darwin
          - os: ubuntu-22.04
            formats: appimage,deb
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxdo-dev libxkbcommon-dev libasound2-dev \
            libwayland-dev libdbus-1-dev libfuse2 file
      - run: cargo install cargo-packager --version ${{ env.CARGO_PACKAGER_VERSION }} --locked
      - name: Build packages
        shell: bash
        run: |
          # before-packaging-command builds for the host; build the target explicitly.
          cargo build --release --target ${{ matrix.target }}
          cargo packager --release --target ${{ matrix.target }} --formats ${{ matrix.formats }}
      - name: macOS ad-hoc signature check
        if: runner.os == 'macOS'
        run: codesign --verify --deep --verbose=2 dist/*.app || true
      - name: Checksums
        shell: bash
        run: |
          cd dist
          find . -maxdepth 1 -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' \) \
            -exec sha256sum {} \; > SHA256SUMS-${{ matrix.target }}.txt || \
          shasum -a 256 *.dmg > SHA256SUMS-${{ matrix.target }}.txt
          cat SHA256SUMS-*.txt
      - uses: actions/upload-artifact@v7
        with:
          name: ghostchat-${{ matrix.target }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
            dist/SHA256SUMS-*.txt
