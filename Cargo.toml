[package]
name = "ghostchat"
version = "0.2.0-alpha"
edition = "2024"
rust-version = "1.95"
description = "Private, end-to-end encrypted live chat for one family"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
argon2 = "0.6.0"
bip39 = "3.0.0"
blake3 = "1.8.7"
chacha20poly1305 = { version = "0.11.0", features = ["getrandom"] }
cpal = "0.18.2"
data-encoding = "2.11.1"
directories = "6.0.0"
eframe = "0.36.2"
# Pinned exactly: iroh's API changes between releases (ARCHITECTURE §2).
iroh = "=1.3.0"
keyring = "4.2.0"
opus = "0.4"
postcard = { version = "1.1.3", features = ["use-std"] }
rand = "0.10.3"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sonora = "0.2"
tokio = { version = "1.53.2", features = ["full"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "env-filter", "ansi"] }
url = "2.5.8"
zeroize = { version = "1.9.1", features = ["derive"] }

[dev-dependencies]
egui_kittest = { version = "0.36.2", features = ["eframe", "wgpu", "snapshot"] }
proptest = "1.11.0"
tempfile = "3.27.0"

[target."cfg(windows)".dependencies]
raw-window-handle = "0.6"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Diagnostics_Debug", "Win32_UI_WindowsAndMessaging"] }

[target."cfg(windows)".build-dependencies]
winresource = { version = "0.1.31", default-features = false }

[target."cfg(unix)".dependencies]
libc = "0.2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Installers: `cargo packager --release` (see README "Building installers").
[package.metadata.packager]
product-name = "GhostChat"
identifier = "app.ghostchat.family"
publisher = "GhostChat"
description = "Private, end-to-end encrypted live chat for one family"
category = "SocialNetworking"
before-packaging-command = "cargo build --release"
out-dir = "dist"
icons = [
  "assets/icons/icon-32.png",
  "assets/icons/icon-128.png",
  "assets/icons/icon-256.png",
  "assets/icons/icon-512.png",
  "assets/icons/icon.ico",
  "assets/icons/icon.icns",
]
binaries = [{ path = "ghostchat", main = true }]

[package.metadata.packager.nsis]
installer-mode = "currentUser"
template = "packaging/windows/installer.nsi"
appdata-paths = ["$APPDATA/GhostChat"]
custom-language-file = { English = "packaging/windows/English.nsh" }
languages = ["English"]

[package.metadata.packager.macos]
# Ad-hoc signature ("-"): free, required to run on Apple Silicon. Not notarized.
signing-identity = "-"
minimum-system-version = "11.0"

[package.metadata.packager.deb]
depends = ["libgtk-3-0", "libxdo3", "libasound2"]
